name: build-windows-codex

# 目的：官方每次发新 release 时，自动拉取官方源码、应用我们的补丁、
# 编译出打了补丁的 codex.exe，并作为 Release 附件发布。
#
# 产物用途：替换本机 npm 包里的 vendor exe
#   node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/
#     vendor/x86_64-pc-windows-msvc/bin/codex.exe

on:
  schedule:
    # 每天 06:00 UTC 检查一次官方有没有新 release
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定官方 tag（留空则用最新非预发布 release）"
        required: false
        type: string
      force:
        description: "强制重建（忽略已构建记录）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # 发 Release + 提交 built-tags.txt
  issues: write # 补丁冲突时开 Issue

env:
  UPSTREAM_REPO: openai/codex
  # 补丁按 tag 分文件存放：patches/<tag>.patch
  # 优先使用目标 tag 的补丁；新 tag 自动尝试最新功能 series，无需先复制版本文件。
  PATCH_DIR: patches
  BINARY: codex

jobs:
  script-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash 管理脚本隔离回归
        shell: bash
        timeout-minutes: 1
        run: |
          bash -n scripts/codex-patch.sh
          bash scripts/tests/codex-patch-shell.Tests.sh

  # ── 阶段 1：确定目标 tag，并检查是否已构建过 ────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
      reason: ${{ steps.pick.outputs.reason }}
      patch: ${{ steps.pick.outputs.patch }}
      patch_baseline: ${{ steps.pick.outputs.patch_baseline }}
      patch_is_exact: ${{ steps.pick.outputs.patch_is_exact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 选择目标 tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
            echo "使用手动指定的 tag: ${tag}"
          else
            # 取最新的正式 release（排除 alpha/beta 等预发布）
            tag="$(gh release list --repo "${UPSTREAM_REPO}" \
              --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
            echo "官方最新正式 release: ${tag}"
          fi

          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "::error::无法确定官方最新 release"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # 优先用该 tag 专属的补丁；官方刚发新版、还没来得及为它写补丁时，
          # 回退到版本号最大的那份补丁先试跑。否则每次上游发版，整条流水线
          # 在 resolve 阶段就直接失败，连一次尝试应用的机会都没有。
          patch="${PATCH_DIR}/${tag}.patch"
          patch_is_exact=true
          if [[ ! -f "${patch}" ]]; then
            patch_is_exact=false
            # 只认 rust-v* 形式的版本补丁，按版本号排序取最新的那份
            patch="$(ls "${PATCH_DIR}"/rust-v*.patch 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -z "${patch}" ]]; then
              echo "::error::${PATCH_DIR} 下没有任何可用补丁，无法构建"
              exit 1
            fi
            echo "⚠️ 缺少 ${tag} 的专属补丁，回退用最新补丁 ${patch} 尝试应用"
          fi
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          echo "patch_is_exact=${patch_is_exact}" >> "$GITHUB_OUTPUT"
          # 基线 = 补丁文件名去掉目录与 .patch 后缀。回退补丁写的 Cargo.lock
          # 版本是它自己的基线版本，需要据此改写成目标 tag 的版本。
          echo "patch_baseline=$(basename "${patch}" .patch)" >> "$GITHUB_OUTPUT"

          if [[ "${FORCE}" == "true" ]]; then
            echo "force=true，跳过已构建检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 已经构建过的 tag 不再重复构建
          if grep -qxF "${tag}" built-tags.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=${tag} 已构建过" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=新 tag，需要构建" >> "$GITHUB_OUTPUT"
          fi

      - name: 结果
        run: |
          echo "tag            = ${{ steps.pick.outputs.tag }}"
          echo "patch          = ${{ steps.pick.outputs.patch }}"
          echo "skip           = ${{ steps.pick.outputs.skip }}"
          echo "reason         = ${{ steps.pick.outputs.reason }}"

  # ── 阶段 2：拉官方源码 + 应用补丁 ──────────────────────────────────
  # 冲突通过 applied=false 阻止构建，并报告失败的功能提交。
  prepare:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
      strategy: ${{ steps.apply.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 验证功能补丁应用流程
        timeout-minutes: 1
        run: python3 scripts/tests/test_apply_patches.py

      - name: 拉取官方源码
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          git clone --depth 1 --branch "${tag}" \
            "https://github.com/${UPSTREAM_REPO}.git" upstream
          git -C upstream switch -c "patched/${tag}"
          echo "官方 tag ${tag} 已拉取"
          git -C upstream log --oneline -1

      - name: 尝试应用补丁
        id: apply
        run: |
          set -euo pipefail
          patch="${GITHUB_WORKSPACE}/${{ needs.resolve.outputs.patch }}"
          tag="${{ needs.resolve.outputs.tag }}"
          bash scripts/apply-patches.sh upstream "$patch" \
            "${{ needs.resolve.outputs.patch_baseline }}" "$GITHUB_WORKSPACE"
          if ! grep -qx 'applied=true' "$GITHUB_OUTPUT"; then
            exit 0
          fi
          cd upstream
          target_version="${tag#rust-v}"

          # Cargo.lock 的 workspace 成员版本对齐。
          # 官方 tag 自带的 lock 里成员版本是 0.0.0，而 Cargo.toml 写的是版本号；
          # 编译用 cargo build --locked，两者必须一致。
          # 补丁已不再改 lock，这里按「成员包」精确改写：先验证 lock 里的 0.0.0
          # 数量恰好等于 version.workspace = true 的包数 —— 相等才说明这些 0.0.0
          # 只属于 workspace 成员，改写不会误伤第三方依赖；不等就报错，不猜。
          echo "::group::对齐 Cargo.lock 成员版本 -> ${target_version}"
          lock="codex-rs/Cargo.lock"
          members="$(grep -rl '^version\.workspace = true' codex-rs --include=Cargo.toml | wc -l | tr -d ' ')"
          zeros="$(grep -c '^version = "0.0.0"$' "${lock}" || true)"
          echo "workspace 成员包: ${members}, lock 中 0.0.0 行: ${zeros}"
          if [[ "${members}" == "0" || "${members}" != "${zeros}" ]]; then
            echo "::error::lock 的 0.0.0 行数与 workspace 成员数不一致，拒绝改写以免误伤依赖"
            exit 1
          fi
          sed -i "s/^version = \"0\.0\.0\"$/version = \"${target_version}\"/" "${lock}"
          after="$(grep -c "^version = \"${target_version}\"$" "${lock}" || true)"
          leftover="$(grep -c '^version = "0.0.0"$' "${lock}" || true)"
          echo "改写后: 成员版本 ${after} 行, 残留 0.0.0 ${leftover} 行"
          if [[ "${leftover}" != "0" || "${after}" != "${members}" ]]; then
            echo "::error::Cargo.lock 成员版本改写不完整"
            exit 1
          fi
          echo "::endgroup::"

      - name: 打包源码与功能提交历史
        if: steps.apply.outputs.applied == 'true'
        # 将链接展开为文件，避免 Windows 解压依赖链接权限和目标恢复顺序。
        run: tar --dereference --hard-dereference -czf patched-source.tar.gz -C upstream .

      - name: 上传应用了补丁的源码
        if: steps.apply.outputs.applied == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: patched-source.tar.gz
          compression-level: 0
          retention-days: 7

      - name: 保存功能冲突报告
        if: steps.apply.outputs.applied == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: patch-conflicts
          path: |
            conflict.log
            conflict-files.txt

      - name: 补丁失败时开 Issue
        if: steps.apply.outputs.applied != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"

          # 同日同 tag 只开一个 Issue
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --state open --search "补丁冲突 ${tag} in:title" \
            --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "已存在该 tag 的冲突 Issue，跳过"
            exit 0
          fi

          {
            echo "补丁无法应用到官方 tag \`${tag}\`。"
            echo
            echo "- 补丁文件：\`${{ needs.resolve.outputs.patch }}\`"
            echo "- 目标版本：\`${tag}\`"
            echo "- 是否该版本专属补丁：\`${{ needs.resolve.outputs.patch_is_exact }}\`"
            echo
            if [[ "${{ needs.resolve.outputs.patch_is_exact }}" == "false" ]]; then
              echo "官方已发 ${tag}，但还没有它的专属补丁，本次已自动回退到最新可用补丁尝试应用。"
            fi
            echo "有功能 series 时按编号执行 \`git am --3way\`；历史合并补丁使用 \`git apply\` / \`git apply --3way\`。"
            echo "自动匹配未成功；请逐项核对上下文变化和行为差异，"
            echo "并在合并后执行相关测试。应用成功本身不能证明行为兼容。"
            echo
            echo "### 冲突详情"
            echo
            echo '```'
            tail -c 8000 "${GITHUB_WORKSPACE}/conflict.log" 2>/dev/null || echo "(无日志)"
            echo '```'
            echo
            echo "### 处理方式"
            echo
            echo "1. 本地 \`git clone --depth 1 -b ${tag} https://github.com/${UPSTREAM_REPO}.git\`"
            echo "2. 在维护仓库运行 \`bash scripts/apply-patches.sh upstream ${{ needs.resolve.outputs.patch }} ${{ needs.resolve.outputs.patch_baseline }} reports\`"
            echo "3. 定位报告中的功能提交，解决冲突后 \`git am --continue\`，接着应用剩余 series 并验证行为。"
            echo "   （补丁**不含** \`Cargo.lock\`：成员版本由 workflow 按目标 tag 自动对齐，"
            echo "   导出新 tag 的合并补丁及功能 series，保留原有版本和功能历史）"
            echo "4. 确认 \`built-tags.txt\` 里没有该 tag（否则会被跳过）"
          } > body.md

          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "补丁冲突：${tag} 无法应用" \
            --body-file body.md

  # ── 阶段 3：编译 codex.exe ────────────────────────────────────────
  build:
    needs: [resolve, prepare]
    if: needs.prepare.outputs.applied == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_HOME: "C:\\cargo"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SCCACHE_GHA_ENABLED: "true"
      # 缓存服务断连时由 CI runner 直接编译，仍保留 rustc 的真实退出码。
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # 只提高服务模块日志级别，避免全局 debug 记录编译环境和 HTTP 请求。
      SCCACHE_LOG: "warn,sccache::server=debug"
    steps:
      - name: 启用 Windows 长路径
        shell: bash
        run: |
          powershell -NoProfile -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1" 2>/dev/null || true
          git config --system core.longpaths true || true
          git config --global core.longpaths true || true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: patched-source

      - name: 恢复源码与功能提交历史
        shell: bash
        run: |
          mkdir -p upstream
          tar -xzf patched-source.tar.gz -C upstream
          test -d upstream/.git
          git -C upstream log -1 --oneline

      # 官方 codex-rs/rust-toolchain.toml 锁定 1.95.0。
      # 用具体版本而非 stable：新版本 Rust 可能引入新 lint 或依赖解析变化，
      # 导致同一个官方 tag 反而编不过。
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: 固定 Rust 版本
        shell: bash
        run: |
          # dtolnay/rust-toolchain 安装后已激活 1.95.0，但 rustup 进入
          # upstream/codex-rs 时会读 rust-toolchain.toml 并尝试再下载一次。
          # 显式覆盖，避免网络抖动或版本漂移。
          rustup override set 1.95.0 --path upstream/codex-rs
          rustc --version
          cargo --version

      - name: 启动缓存诊断采样
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci-cache-diagnostics.ps1 -Action Start

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/codex-rs
          # 依赖继续复用 Cargo target；项目 crate 由 sccache 按编译输入复用。
          cache-targets: true
          cache-on-failure: true

      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
        with:
          version: "v0.16.0"
          # 统计由下方步骤处理，避免安装失败后 post 再执行不存在的程序。
          disable_annotations: true

      - name: 启用项目编译缓存
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: 把 migration SQL 转成 CRLF（对齐官方 Windows 构建）
        shell: bash
        run: |
          set -euo pipefail
          # sqlx 在编译期把每个 migration 的 sha384 嵌进二进制，
          # 运行时与数据库 _sqlx_migrations 表里的 checksum 比对。
          #
          # 官方在 Windows 上构建时，checkout 会把 .sql 转成 CRLF，
          # 所以它的 checksum 是按 CRLF 算的。实测 6 个库共 69 个
          # migration 文件全部如此，无一例外：
          #   state_5.sqlite            migrations/            55
          #   logs_2.sqlite             logs_migrations/        2
          #   goals_1.sqlite            goals_migrations/       2
          #   memories_1.sqlite         memory_migrations/      2
          #   queue_1.sqlite            queue_migrations/       2
          #   thread_history_1.sqlite   thread_history_migrations/ 6
          #
          # 而 actions/checkout 不做换行转换，拿到 LF，算出的 checksum
          # 与数据库不符，启动就报
          # "migration 1 was previously applied but has been modified"。
          #
          # 用一次 python 处理全部文件；逐个 sed -i 在 Windows 上会因为
          # 反复创建进程而慢上百倍。
          # 注意：Windows 上 python 默认 stdout 是 cp1252，输出中文会
          # UnicodeEncodeError，所以这里只打印 ASCII。
          python3 - <<'PY'
          import os, sys

          root = "upstream/codex-rs/state"
          # 递归找出所有 *_migrations 目录，官方将来新增目录也能自动覆盖
          targets = sorted(
              os.path.join(dirpath, name)
              for dirpath, dirnames, _ in os.walk(root)
              for name in dirnames
              if name.endswith("migrations")
          )
          if not targets:
              print("::error::no *_migrations directories found")
              sys.exit(1)

          total = 0
          for mig_dir in targets:
              files = sorted(f for f in os.listdir(mig_dir) if f.endswith(".sql"))
              for name in files:
                  path = os.path.join(mig_dir, name)
                  data = open(path, "rb").read()
                  # 先统一成 LF 再转 CRLF，保证幂等（重复运行结果一致）
                  normalized = data.replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
                  if normalized != data:
                      open(path, "wb").write(normalized)
              total += len(files)
              print(f"  {os.path.relpath(mig_dir, root)}: {len(files)} files")

          print(f"converted {total} files in {len(targets)} directories")
          PY

      - name: 校验 migration 换行（编译前门禁）
        shell: bash
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          # 编译进二进制的 checksum 必须与官方 exe 一致，否则用户换上新 exe
          # 会因数据库校验失败而无法启动（migration N was modified）。
          # 必须在 cargo build 之前拦下，编完再查已经来不及。
          # 注意：Windows 上 python 默认 stdout 是 cp1252，输出中文会
          # UnicodeEncodeError，所以这里只打印 ASCII。
          python3 - <<'PY'
          import os, sys

          root = "state"
          targets = sorted(
              os.path.join(dirpath, name)
              for dirpath, dirnames, _ in os.walk(root)
              for name in dirnames
              if name.endswith("migrations")
          )
          if not targets:
              print("::error::no *_migrations directories found")
              sys.exit(1)

          bad = []
          total = 0
          for mig_dir in targets:
              for name in sorted(f for f in os.listdir(mig_dir) if f.endswith(".sql")):
                  data = open(os.path.join(mig_dir, name), "rb").read()
                  crlf = data.count(b"\r\n")
                  lf = data.count(b"\n")
                  rel = os.path.relpath(os.path.join(mig_dir, name), root)
                  if crlf == 0:
                      bad.append((rel, "no CRLF"))
                  elif crlf != lf:
                      bad.append((rel, f"mixed line endings CRLF={crlf} LF={lf}"))
                  total += 1

          print(f"checked {total} migration files in {len(targets)} directories")
          if bad:
              for rel, why in bad:
                  print(f"::error file={rel}::{why}")
              sys.exit(1)
          print("all migration files are pure CRLF; checksums will match the official exe")
          PY

      - name: 重建并校验协议导出
        working-directory: upstream/codex-rs
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # 新版把协议导出嵌入压缩文件；从源码生成，避免二进制补丁随每版失效。
          # 旧 tag 尚无这个上游入口，保留其原有构建路径。
          if [[ ! -f app-server-protocol/src/schema_fixtures.rs ]]; then
            echo "This tag predates the schema fixture generator; skipping."
            exit 0
          fi
          export CODEX_APP_SERVER_SCHEMA_ROOT="$(cygpath -m "$PWD/app-server-protocol/schema")"
          # 两种导出复用同一个生成器，写完后再重编并校验内嵌文件。
          cargo test --locked -p codex-app-server-protocol --lib --no-run \
            --message-format=json > "$RUNNER_TEMP/protocol-build.jsonl"
          generator="$(python3 - "$RUNNER_TEMP/protocol-build.jsonl" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              artifacts = [json.loads(line) for line in stream]
          executables = [a["executable"] for a in artifacts
                         if a.get("reason") == "compiler-artifact" and a.get("executable")
                         and a["target"]["name"] == "codex_app_server_protocol" and a["profile"]["test"]]
          if len(executables) != 1:
              raise SystemExit(f"Expected one protocol test executable, got {executables}")
          print(executables[0].replace("\\", "/"))
          PY
          )"
          for api in 0 1; do
            CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL="$api" \
              "$generator" schema_fixtures_tests::write_schema_fixtures_from_env --exact --ignored
          done
          cargo test --locked -p codex-app-server-protocol --lib schema_fixtures_tests::

      - name: 构建环境
        shell: bash
        run: |
          rustc --version
          cargo --version
          echo "逻辑 CPU: $(nproc)"
          df -h .

      - name: 编译 codex.exe
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # 只编 codex 这一个 bin。不编 code-mode-host 就不会拉 V8 产物。
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          # 官方在 x86_64-pc-windows-msvc 上用这个开关规避 sqlite 内联汇编问题
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC

          start=$(date +%s)
          # 保留原始编译日志，耗时由 Cargo 报告。
          build_log="${RUNNER_TEMP}/cargo-build.log"
          cargo build --locked --release --timings \
            --target x86_64-pc-windows-msvc \
            --bin "${BINARY}" 2>&1 | tee "$build_log"
          elapsed=$(($(date +%s) - start))
          {
            echo "### Release 编译"
            echo "- 耗时：${elapsed} 秒"
            echo "- 编译缓存统计见 sccache 步骤；各 crate 耗时见 cargo-timings artifact。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收集缓存诊断
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci-cache-diagnostics.ps1 -Action Finish

      - name: 编译缓存统计
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: sccache --show-stats | tee "$RUNNER_TEMP/cache-diagnostics/sccache-stats.txt"

      - name: 保存缓存诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-build
          path: ${{ runner.temp }}/cache-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: 上传编译耗时
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: upstream/codex-rs/target/cargo-timings
          if-no-files-found: ignore

      - name: 校验产物
        shell: bash
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          exe="target/x86_64-pc-windows-msvc/release/${BINARY}.exe"
          if [[ ! -f "${exe}" ]]; then
            echo "::error::未找到 ${exe}"
            exit 1
          fi
          ls -la "${exe}"
          "${exe}" --version

      - name: 打包
        shell: bash
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          exe="target/x86_64-pc-windows-msvc/release/${BINARY}.exe"
          mkdir -p dist
          cp "${exe}" "dist/codex.exe"
          # 一起带上版本信息，方便替换前核对
          {
            echo "upstream_tag: ${tag}"
            echo "patch_file: ${{ needs.resolve.outputs.patch }}"
            echo "patch_is_exact: ${{ needs.resolve.outputs.patch_is_exact }}"
            echo "patch_baseline: ${{ needs.resolve.outputs.patch_baseline }}"
            echo "apply_strategy: ${{ needs.prepare.outputs.strategy }}"
            echo "source_commit: $(git rev-parse HEAD)"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          # 导出目标 tag 上实际应用的差异，跨版本合并后也能直接重放。
          git -C .. diff --binary --full-index "${tag}" HEAD -- . ':!codex-rs/Cargo.lock' > dist/codex-cli.patch
          cd dist && 7z a -tzip "../codex-${tag}-windows-x64.zip" ./

      - name: 发布用二进制摘要
        working-directory: upstream/codex-rs
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          version = os.environ['TAG'].removeprefix('rust-v')
          target = 'x86_64-pc-windows-msvc'
          url = f'https://registry.npmjs.org/@openai/codex/{version}-win32-x64'
          with urllib.request.urlopen(url, timeout=60) as response:
              metadata = json.load(response)
          dist = metadata['dist']
          if not dist['tarball'].startswith('https://registry.npmjs.org/'):
              raise RuntimeError('Unexpected npm tarball URL')
          with urllib.request.urlopen(dist['tarball'], timeout=120) as response:
              archive = response.read()
          algorithm, expected = dist['integrity'].split('-', 1)
          if algorithm != 'sha512' or base64.b64encode(hashlib.sha512(archive).digest()).decode() != expected:
              raise RuntimeError('npm integrity mismatch')
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              official = package.extractfile(f'package/vendor/{target}/bin/codex.exe').read()
          manifest = dict(version=version, target=target,
                          official_sha256=hashlib.sha256(official).hexdigest(),
                          patched_sha256=hashlib.sha256(pathlib.Path('dist/codex.exe').read_bytes()).hexdigest())
          pathlib.Path('binary-hashes.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x64
          path: |
            upstream/codex-rs/codex-*.zip
            upstream/codex-rs/binary-hashes.json

  # ── 阶段 3b：并行回归本地文件链接 ─────────────────────────────────
  # 与 release 构建并行，避免把测试时间串到 1 小时以上的构建之后。
  test:
    needs: [resolve, prepare]
    if: needs.prepare.outputs.applied == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_HOME: "C:\\cargo"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_LOG: "warn,sccache::server=debug"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - name: 启用 Windows 长路径
        shell: bash
        run: |
          powershell -NoProfile -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1" 2>/dev/null || true
          git config --system core.longpaths true || true
          git config --global core.longpaths true || true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: patched-source

      - name: 恢复源码与功能提交历史
        shell: bash
        run: |
          mkdir -p upstream
          tar -xzf patched-source.tar.gz -C upstream
          test -d upstream/.git

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: 固定 Rust 版本
        shell: bash
        run: |
          rustup override set 1.95.0 --path upstream/codex-rs
          rustc --version
          cargo --version

      - name: 启动缓存诊断采样
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci-cache-diagnostics.ps1 -Action Start

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/codex-rs
          # test/release 的 target 分开保存，避免并行 job 争抢同一个不可变缓存键。
          # 自动键包含 job、Rust 和依赖信息；不绑定 tag 或提交。
          cache-targets: true
          cache-on-failure: true

      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
        with:
          version: "v0.16.0"
          disable_annotations: true

      - name: 启用项目编译缓存
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: 重试格式检查与回归
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          rustfmt --edition 2024 --check codex-client/src/retry.rs \
            model-provider-info/src/lib.rs model-provider-info/src/model_provider_info_tests.rs \
            core/src/compact.rs core/src/responses_retry.rs core/tests/suite/retry_after.rs
          cargo test --locked --profile ci-test -p codex-client --lib configured_retry_tests
          cargo test --locked --profile ci-test -p codex-model-provider-info --lib retry_configuration
          cargo test --locked --profile ci-test -p codex-core --lib responses_retry::tests
          cargo test --locked --profile ci-test -p codex-core --test suite retry_after::

      - name: 本地链接回归
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # 一次编译测试目标，libtest 按多个名字取并集，包含相邻行为的回归。
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          start=$(date +%s)
          cargo test --locked --profile ci-test -p codex-tui --lib -- \
            local_links editor_links web_links terminal_hyperlinks markdown_copy \
            quote_appends_to_draft_tail_and_preserves_attachments \
            2>&1 | tee "$RUNNER_TEMP/tui-tests.log"
          echo "TUI tests: $(($(date +%s) - start)) seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: 收集缓存诊断
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci-cache-diagnostics.ps1 -Action Finish

      - name: 编译缓存统计
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: sccache --show-stats | tee "$RUNNER_TEMP/cache-diagnostics/sccache-stats.txt"

      - name: 保存缓存诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-test
          path: ${{ runner.temp }}/cache-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: 保存 TUI 测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-test-log
          path: ${{ runner.temp }}/tui-tests.log
          if-no-files-found: ignore

  # ── 阶段 4：发 Release 并记录已构建 tag ───────────────────────────
  release:
    needs: [resolve, build, test, script-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: codex-windows-x64
          path: dist

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          cat > notes.md <<'EOF'
          基于官方 Codex 构建的 Windows x64 补丁版本。

          ### 下载与安装

          下载本页 zip，内含 `codex.exe`、`BUILD-INFO.txt` 和实际应用的 `codex-cli.patch`。
          独立附件 `binary-hashes.json` 提供同版本官方与补丁二进制的 SHA-256，状态检查无需下载 zip。

          安装前核对 `BUILD-INFO.txt` 的 `upstream_tag`、`patch_baseline` 和 `patch_is_exact`。补丁可能由其他基线迁移，实际差异以 zip 内补丁为准。

          使用下方安装说明中的管理脚本，或按功能文档手动安装。手动替换前退出 CLI 并备份，使用同版本完整 npm 包；独立 daemon 需另行同步。完成后核对 CLI 与 daemon 状态。
          EOF

          # 链接固定到本次构建提交，避免后续配置变化改写已发布产物的说明。
          docs="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}"
          printf '\n- 官方版本：`%s`\n' "${TAG}" >> notes.md
          printf -- '- [功能与配置](%s/CODEX-BUILD.md)\n' "${docs}" >> notes.md
          printf -- '- [安装、恢复与状态检查](%s/scripts/README.md)\n' "${docs}" >> notes.md
          printf -- '- [本次构建与测试](https://github.com/%s/actions/runs/%s)\n' "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" >> notes.md

          # 幂等：Release 已存在时不能再用 create（重名直接失败），
          # 而且 gh release create 并不支持 --clobber（只有 upload 支持）。
          # 所以先探测，已存在则改说明 + 覆盖附件。
          title="${TAG} + codex-cli patches"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新说明并覆盖附件"
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes-file notes.md
            gh release upload "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              dist/*
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes-file notes.md \
              dist/*
          fi

      - name: 记录已构建 tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qxF "${TAG}" built-tags.txt; then
            echo "${TAG}" >> built-tags.txt
            git config user.email "ci@localhost"
            git config user.name "ci"
            git add built-tags.txt
            git commit -m "Record built tag ${TAG}"

            # 多个 tag 并行构建时，收尾阶段都要往 built-tags.txt 追加并 push，
            # 先推成功的会让后面的 push 被拒。这一步失败就意味着 tag 没被记录、
            # 下次 schedule 会把整条流水线（约 1.5 小时）重跑一遍，所以必须成功。
            # 策略：先 rebase 到最新远端再推，失败则退避重试。
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "已记录 ${TAG}（第 ${attempt} 次尝试）"
                pushed=true
                break
              fi
              echo "push 被拒（第 ${attempt} 次），rebase 到最新远端后重试"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
              sleep $((attempt * 5))
            done

            if [[ "${pushed}" != "true" ]]; then
              echo "::error::无法把 ${TAG} 写入 built-tags.txt（远端持续被更新）"
              exit 1
            fi
          fi
