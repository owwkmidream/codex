name: build-windows-codex

# 目的：官方每次发新 release 时，自动拉取官方源码、应用我们的补丁、
# 编译出打了补丁的 codex.exe，并作为 Release 附件发布。
#
# 产物用途：替换本机 npm 包里的 vendor exe
#   node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/
#     vendor/x86_64-pc-windows-msvc/bin/codex.exe

on:
  schedule:
    # 每天 06:00 UTC 检查一次官方有没有新 release
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定官方 tag（留空则用最新非预发布 release）"
        required: false
        type: string
      force:
        description: "强制重建（忽略已构建记录）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # 发 Release + 提交 built-tags.txt
  issues: write # 补丁冲突时开 Issue

env:
  UPSTREAM_REPO: openai/codex
  # 补丁按 tag 分文件存放：patches/<tag>.patch
  # 补丁是按具体官方版本写的，所以一个 tag 对应一份补丁；换 tag 就换文件，
  # 不再共用一个 patches/codex-cli.patch 槽位（那会导致只有最新 tag 能构建）。
  PATCH_DIR: patches
  BINARY: codex

jobs:
  # ── 阶段 1：确定目标 tag，并检查是否已构建过 ────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
      reason: ${{ steps.pick.outputs.reason }}
      patch: ${{ steps.pick.outputs.patch }}
      patch_baseline: ${{ steps.pick.outputs.patch_baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 选择目标 tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
            echo "使用手动指定的 tag: ${tag}"
          else
            # 取最新的正式 release（排除 alpha/beta 等预发布）
            tag="$(gh release list --repo "${UPSTREAM_REPO}" \
              --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
            echo "官方最新正式 release: ${tag}"
          fi

          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "::error::无法确定官方最新 release"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # 该 tag 专属的补丁文件。补丁按具体版本写，因此 tag 与补丁一一对应，
          # 手动指定任意 tag 都能命中它自己的那份，不会串用别的版本。
          patch="${PATCH_DIR}/${tag}.patch"
          if [[ ! -f "${patch}" ]]; then
            echo "::error::缺少 ${tag} 的补丁 ${patch}；请先为该 tag 生成补丁再构建"
            exit 1
          fi
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          # 基线就是 patch 文件名去掉目录与后缀，仅用于 issue 与产物元信息展示
          echo "patch_baseline=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "${FORCE}" == "true" ]]; then
            echo "force=true，跳过已构建检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 已经构建过的 tag 不再重复构建
          if grep -qxF "${tag}" built-tags.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=${tag} 已构建过" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=新 tag，需要构建" >> "$GITHUB_OUTPUT"
          fi

      - name: 结果
        run: |
          echo "tag            = ${{ steps.pick.outputs.tag }}"
          echo "patch          = ${{ steps.pick.outputs.patch }}"
          echo "skip           = ${{ steps.pick.outputs.skip }}"
          echo "reason         = ${{ steps.pick.outputs.reason }}"

  # ── 阶段 2：拉官方源码 + 应用补丁 ──────────────────────────────────
  # 补丁冲突时不算「构建失败」，而是开 Issue 通知，所以用 continue-on-error
  # 把结果透给下游判断，避免每天收失败邮件。
  prepare:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
      strategy: ${{ steps.apply.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 拉取官方源码
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          git clone --depth 1 --branch "${tag}" \
            "https://github.com/${UPSTREAM_REPO}.git" upstream
          echo "官方 tag ${tag} 已拉取"
          git -C upstream log --oneline -1

      - name: 尝试应用补丁
        id: apply
        run: |
          set -euo pipefail
          # 该 tag 专属的补丁（resolve 阶段已确认存在）
          patch="${GITHUB_WORKSPACE}/${{ needs.resolve.outputs.patch }}"
          cd upstream

          echo "::group::尝试 1：直接 git apply"
          if git apply --verbose "${patch}"; then
            echo "strategy=git apply" >> "$GITHUB_OUTPUT"
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            echo "✅ 补丁直接应用成功"
            exit 0
          fi
          echo "::endgroup::"

          # 直接失败说明上下文有偏移，尝试三方合并
          # 注意：--3way 需要 pre-image blob 在对象库中，浅克隆拿不到，
          # 所以要先补全历史。这一步较慢但只在直接失败时才走。
          echo "::group::尝试 2：git apply --3way（需补全历史）"
          git fetch --unshallow 2>/dev/null || git fetch --all
          if git apply --3way "${patch}"; then
            echo "strategy=git apply --3way" >> "$GITHUB_OUTPUT"
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            echo "✅ 补丁三方合并成功"
            exit 0
          fi
          echo "::endgroup::"

          echo "❌ 两种方式都失败"
          echo "applied=false" >> "$GITHUB_OUTPUT"
          echo "strategy=none" >> "$GITHUB_OUTPUT"

          # 留一份冲突详情给 Issue 用
          git apply --verbose "${patch}" \
            > "${GITHUB_WORKSPACE}/conflict.log" 2>&1 || true
          exit 0 # 不失败，交给下游判断

      - name: 上传应用了补丁的源码
        if: steps.apply.outputs.applied == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: upstream
          retention-days: 1

      - name: 补丁失败时开 Issue
        if: steps.apply.outputs.applied != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"

          # 同日同 tag 只开一个 Issue
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --state open --search "补丁冲突 ${tag} in:title" \
            --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "已存在该 tag 的冲突 Issue，跳过"
            exit 0
          fi

          {
            echo "补丁无法应用到官方 tag \`${tag}\`。"
            echo
            echo "- 补丁文件：\`${{ needs.resolve.outputs.patch }}\`"
            echo "- 目标版本：\`${tag}\`"
            echo
            echo "官方改动破坏了补丁的上下文，需要人工更新该 tag 的补丁文件。"
            echo
            echo "### 冲突详情"
            echo
            echo '```'
            tail -c 8000 "${GITHUB_WORKSPACE}/conflict.log" 2>/dev/null || echo "(无日志)"
            echo '```'
            echo
            echo "### 处理方式"
            echo
            echo "1. 本地 \`git clone --depth 1 -b ${tag} https://github.com/${UPSTREAM_REPO}.git\`"
            echo "2. \`git apply --3way ${{ needs.resolve.outputs.patch }}\` 看冲突"
            echo "3. 按新代码结构重写补丁：\`patches/${tag}.patch\`"
            echo "4. 确认 \`built-tags.txt\` 里没有该 tag（否则会被跳过）"
          } > body.md

          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "补丁冲突：${tag} 无法应用" \
            --body-file body.md

  # ── 阶段 3：编译 codex.exe ────────────────────────────────────────
  build:
    needs: [resolve, prepare]
    if: needs.prepare.outputs.applied == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: upstream

      # 官方 codex-rs/rust-toolchain.toml 锁定 1.95.0。
      # 用具体版本而非 stable：新版本 Rust 可能引入新 lint 或依赖解析变化，
      # 导致同一个官方 tag 反而编不过。
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: 固定 Rust 版本
        shell: bash
        run: |
          # dtolnay/rust-toolchain 安装后已激活 1.95.0，但 rustup 进入
          # upstream/codex-rs 时会读 rust-toolchain.toml 并尝试再下载一次。
          # 显式覆盖，避免网络抖动或版本漂移。
          rustup override set 1.95.0 --path upstream/codex-rs
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/codex-rs
          # 缓存 registry + 依赖编译产物（target）。实测数据：
          #
          #   cache-targets: true  首次冷启动 Compiling 1031 个 crate，
          #                        结束时存入 1463MB 缓存；
          #                        下一次命中该缓存后 Compiling 只剩 139 个，
          #                        且全是 codex-* 自身的 workspace 成员，
          #                        tokio/serde/syn 等第三方依赖一个都没重编。
          #   cache-targets: false 命中缓存也只恢复 496MB registry，
          #                        Downloading 归零但 Compiling 仍是 1031。
          #
          # rust-cache 并非整包 target（那有 9.15GB，确实超 10GB 上限），
          # 它只挑依赖产物，实际 1463MB，完全放得下。
          # 曾经按「target 有 20-40GB」判断存不下而关掉，与实测不符。
          #
          # 不要按 tag 分桶：相邻官方版本的依赖几乎不变，分桶只会让
          # 每个版本都从零重编。
          cache-targets: true
          cache-on-failure: true

      - name: 固化补丁后的改动为提交
        working-directory: upstream
        run: |
          git config user.email "ci@localhost"
          git config user.name "ci"
          git add -A
          git commit -m "apply codex-cli patches"

      - name: 把 migration SQL 转成 CRLF（对齐官方 Windows 构建）
        shell: bash
        run: |
          set -euo pipefail
          # sqlx 在编译期把每个 migration 的 sha384 嵌进二进制，
          # 运行时与数据库 _sqlx_migrations 表里的 checksum 比对。
          #
          # 官方在 Windows 上构建时，checkout 会把 .sql 转成 CRLF，
          # 所以它的 checksum 是按 CRLF 算的。实测 6 个库共 69 个
          # migration 文件全部如此，无一例外：
          #   state_5.sqlite            migrations/            55
          #   logs_2.sqlite             logs_migrations/        2
          #   goals_1.sqlite            goals_migrations/       2
          #   memories_1.sqlite         memory_migrations/      2
          #   queue_1.sqlite            queue_migrations/       2
          #   thread_history_1.sqlite   thread_history_migrations/ 6
          #
          # 而 actions/checkout 不做换行转换，拿到 LF，算出的 checksum
          # 与数据库不符，启动就报
          # "migration 1 was previously applied but has been modified"。
          #
          # 用一次 python 处理全部文件；逐个 sed -i 在 Windows 上会因为
          # 反复创建进程而慢上百倍。
          # 注意：Windows 上 python 默认 stdout 是 cp1252，输出中文会
          # UnicodeEncodeError，所以这里只打印 ASCII。
          python3 - <<'PY'
          import os, sys

          root = "upstream/codex-rs/state"
          # 递归找出所有 *_migrations 目录，官方将来新增目录也能自动覆盖
          targets = sorted(
              os.path.join(dirpath, name)
              for dirpath, dirnames, _ in os.walk(root)
              for name in dirnames
              if name.endswith("migrations")
          )
          if not targets:
              print("::error::no *_migrations directories found")
              sys.exit(1)

          total = 0
          for mig_dir in targets:
              files = sorted(f for f in os.listdir(mig_dir) if f.endswith(".sql"))
              for name in files:
                  path = os.path.join(mig_dir, name)
                  data = open(path, "rb").read()
                  # 先统一成 LF 再转 CRLF，保证幂等（重复运行结果一致）
                  normalized = data.replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
                  if normalized != data:
                      open(path, "wb").write(normalized)
              total += len(files)
              print(f"  {os.path.relpath(mig_dir, root)}: {len(files)} files")

          print(f"converted {total} files in {len(targets)} directories")
          PY

      - name: 校验 migration 换行（编译前门禁）
        shell: bash
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          # 编译进二进制的 checksum 必须与官方 exe 一致，否则用户换上新 exe
          # 会因数据库校验失败而无法启动（migration N was modified）。
          # 必须在 cargo build 之前拦下，编完再查已经来不及。
          # 注意：Windows 上 python 默认 stdout 是 cp1252，输出中文会
          # UnicodeEncodeError，所以这里只打印 ASCII。
          python3 - <<'PY'
          import os, sys

          root = "state"
          targets = sorted(
              os.path.join(dirpath, name)
              for dirpath, dirnames, _ in os.walk(root)
              for name in dirnames
              if name.endswith("migrations")
          )
          if not targets:
              print("::error::no *_migrations directories found")
              sys.exit(1)

          bad = []
          total = 0
          for mig_dir in targets:
              for name in sorted(f for f in os.listdir(mig_dir) if f.endswith(".sql")):
                  data = open(os.path.join(mig_dir, name), "rb").read()
                  crlf = data.count(b"\r\n")
                  lf = data.count(b"\n")
                  rel = os.path.relpath(os.path.join(mig_dir, name), root)
                  if crlf == 0:
                      bad.append((rel, "no CRLF"))
                  elif crlf != lf:
                      bad.append((rel, f"mixed line endings CRLF={crlf} LF={lf}"))
                  total += 1

          print(f"checked {total} migration files in {len(targets)} directories")
          if bad:
              for rel, why in bad:
                  print(f"::error file={rel}::{why}")
              sys.exit(1)
          print("all migration files are pure CRLF; checksums will match the official exe")
          PY

      # ── 诊断：编译前 ───────────────────────────────────────────────
      # 一次性采集全部可能影响耗时的信息，避免反复重跑。
      # 官方基线（自建 runner，无缓存，从零编译）：
      #   16 逻辑核 / 64 GiB / 1053 个 crate / 44 分 48 秒
      - name: 诊断（编译前）
        shell: bash
        run: |
          set -uo pipefail
          line() { printf '\n===== %s =====\n' "$1"; }

          line "1. Runner 硬件"
          echo "RUNNER_NAME       : ${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS         : ${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH       : ${RUNNER_ARCH:-unknown}"
          echo "IMAGE_OS          : ${ImageOS:-unknown}"
          echo "IMAGE_VERSION     : ${ImageVersion:-unknown}"
          powershell -NoProfile -Command "
            \$c = Get-CimInstance Win32_ComputerSystem
            \$p = Get-CimInstance Win32_Processor | Select-Object -First 1
            Write-Host ('CPU               : ' + \$p.Name)
            Write-Host ('Physical cores    : ' + \$p.NumberOfCores)
            Write-Host ('Logical CPUs      : ' + \$p.NumberOfLogicalProcessors)
            Write-Host ('Total RAM GiB     : ' + [math]::Round(\$c.TotalPhysicalMemory/1GB,1))
            Write-Host ('MaxClock MHz      : ' + \$p.MaxClockSpeed)
          " 2>&1 || echo "(powershell 查询失败)"
          echo "nproc (bash 视角) : $(nproc 2>/dev/null || echo '?')"

          line "2. 磁盘"
          df -h . 2>/dev/null || true
          echo "--- 各盘符 ---"
          powershell -NoProfile -Command "Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round(\$_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round(\$_.Free/1GB,1)}} | Format-Table -AutoSize" 2>&1 || true

          line "3. 工具链"
          rustc --version 2>&1 || true
          cargo --version 2>&1 || true
          rustup toolchain list 2>&1 || true
          rustup target list --installed 2>&1 || true
          echo "CARGO_HOME        : ${CARGO_HOME:-unset}"
          echo "CARGO_TARGET_DIR  : ${CARGO_TARGET_DIR:-unset}"
          echo "CARGO_INCREMENTAL : ${CARGO_INCREMENTAL:-unset}"
          echo "RUSTFLAGS         : ${RUSTFLAGS:-unset}"
          echo "CC / CXX          : ${CC:-unset} / ${CXX:-unset}"

          line "4. 源码规模"
          echo "仓库文件总数      : $(git -C upstream ls-files 2>/dev/null | wc -l)"
          echo "workspace 成员数  : $(grep -c '^\s*"' upstream/codex-rs/Cargo.toml 2>/dev/null || echo '?')"
          echo "Cargo.lock 大小   : $(wc -c < upstream/codex-rs/Cargo.lock 2>/dev/null || echo '?') 字节"
          echo "Cargo.lock 包数   : $(grep -c '^name = ' upstream/codex-rs/Cargo.lock 2>/dev/null || echo '?')"
          echo "--- 补丁应用情况 ---"
          git -C upstream show --stat --oneline HEAD 2>/dev/null | tail -5

          line "5. 缓存恢复了什么（关键）"
          CH="${CARGO_HOME:-$HOME/.cargo}"
          echo "--- target 是否存在 ---"
          if [[ -d upstream/codex-rs/target ]]; then
            echo "target 目录: 存在"
            du -sh upstream/codex-rs/target 2>/dev/null || true
            echo "--- target 一级子目录 ---"
            du -sh upstream/codex-rs/target/* 2>/dev/null | sort -rh | head -10 || true
            echo "--- target 内目录数 / 文件数 ---"
            find upstream/codex-rs/target -type d 2>/dev/null | wc -l
            find upstream/codex-rs/target -type f 2>/dev/null | wc -l
            echo "--- release 目录内容统计 ---"
            REL="upstream/codex-rs/target/x86_64-pc-windows-msvc/release"
            if [[ -d "$REL" ]]; then
              du -sh "$REL" 2>/dev/null || true
              echo "rlib 数   : $(find "$REL" -maxdepth 1 -name '*.rlib' 2>/dev/null | wc -l)"
              echo "rmeta 数  : $(find "$REL" -maxdepth 1 -name '*.rmeta' 2>/dev/null | wc -l)"
              echo "d 目录数  : $(find "$REL" -maxdepth 1 -name '*.d' 2>/dev/null | wc -l)"
              echo "exe 数    : $(find "$REL" -maxdepth 1 -name '*.exe' 2>/dev/null | wc -l)"
              echo "--- 前 10 个 rlib（判断缓存到底存了什么）---"
              find "$REL" -maxdepth 1 -name '*.rlib' 2>/dev/null | head -10
            else
              echo "release 目录不存在 -> 缓存没有恢复任何编译产物"
            fi
            echo "--- deps 目录 ---"
            DEPS="$REL/deps"
            if [[ -d "$DEPS" ]]; then
              du -sh "$DEPS" 2>/dev/null || true
              echo "deps 文件数: $(find "$DEPS" -type f 2>/dev/null | wc -l)"
            else
              echo "deps 目录不存在"
            fi
          else
            echo "target 目录: 不存在 -> 完全冷启动"
          fi

          line "6. cargo 缓存目录"
          du -sh "$CH" 2>/dev/null || echo "($CH 不存在)"
          du -sh "$CH/registry" 2>/dev/null || echo "(registry 不存在)"
          du -sh "$CH/registry/cache" 2>/dev/null || echo "(registry/cache 不存在)"
          du -sh "$CH/registry/src" 2>/dev/null || echo "(registry/src 不存在)"
          du -sh "$CH/git" 2>/dev/null || echo "(git 不存在)"
          echo "registry crate 数: $(find "$CH/registry/cache" -name '*.crate' 2>/dev/null | wc -l)"
          echo "解包源码数       : $(find "$CH/registry/src" -maxdepth 2 -mindepth 2 -type d 2>/dev/null | wc -l)"

          line "7. cargo 配置"
          for f in "$CH/config.toml" "$CH/config" "upstream/codex-rs/.cargo/config.toml"; do
            if [[ -f "$f" ]]; then
              echo "--- $f ---"
              cat "$f" || true
            fi
          done
          echo "--- 环境变量中的 CARGO_* ---"
          env | grep -i '^CARGO' | sort || echo "(无)"

          line "8. 网络（影响依赖下载）"
          github_ping=$( { curl -sS -o /dev/null -w '%{time_total}s http=%{http_code}' \
            --max-time 15 https://github.com 2>&1; } || echo "失败" )
          echo "github.com        : $github_ping"
          crates_ping=$( { curl -sS -o /dev/null -w '%{time_total}s http=%{http_code}' \
            --max-time 15 https://static.crates.io 2>&1; } || echo "失败" )
          echo "static.crates.io  : $crates_ping"

          line "9. 进程与资源基线"
          powershell -NoProfile -Command "Get-Process | Sort-Object WS -Descending | Select-Object -First 5 Name,@{n='MemMB';e={[math]::Round(\$_.WS/1MB)}} | Format-Table -AutoSize" 2>&1 || true
          echo "--- 环境变量样本（可能影响构建的）---"
          env | grep -iE '^(CI|GITHUB_|RUNNER_|VCPKG|LIBSQLITE|AWS_LC|MSVC|VSCMD|INCLUDE|LIB)=' | sort | head -30 || true

          echo
          echo "===== 诊断（编译前）结束 ====="

      - name: 编译 codex.exe
        working-directory: upstream/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # 只编 codex 这一个 bin。不编 code-mode-host 就不会拉 V8 产物。
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          # 官方在 x86_64-pc-windows-msvc 上用这个开关规避 sqlite 内联汇编问题
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC

          # 记录编译前状态，用于事后判断 cargo 实际重编了多少
          target_dir="target/x86_64-pc-windows-msvc/release"
          before_rlib=0
          before_fingerprint=0
          if [[ -d "$target_dir" ]]; then
            before_rlib=$(find "$target_dir" -maxdepth 1 -name '*.rlib' 2>/dev/null | wc -l)
          fi
          if [[ -d target/release/.fingerprint ]]; then
            before_fingerprint=$(find target/release/.fingerprint -maxdepth 1 -type d 2>/dev/null | wc -l)
          fi
          echo "编译前 rlib 数: ${before_rlib}"
          echo "编译前 fingerprint 数: ${before_fingerprint}"
          echo "::notice::编译前 rlib=${before_rlib} fingerprint=${before_fingerprint}"

          start=$(date +%s)
          # 日志落到 RUNNER_TEMP（Windows 上必定可写），供后面统计
          build_log="${RUNNER_TEMP:-/tmp}/cargo-build.log"
          cargo build --locked --release \
            --target x86_64-pc-windows-msvc \
            --bin "${BINARY}" 2>&1 | tee "$build_log"
          end=$(date +%s)
          elapsed=$((end - start))

          # ── 编译统计 ──
          # 用 wc -l 而非 grep -c：grep -c 无匹配时返回退出码 1，
          # 在 $() 里配 "|| echo 0" 会输出两行，污染结果。
          n() { wc -l < "$1" 2>/dev/null | tr -d ' \n'; }
          grep 'Compiling ' "$build_log" > "${RUNNER_TEMP:-/tmp}/c.txt" 2>/dev/null || true
          grep 'Building \[' "$build_log" > "${RUNNER_TEMP:-/tmp}/b.txt" 2>/dev/null || true
          grep 'Downloading ' "$build_log" > "${RUNNER_TEMP:-/tmp}/d.txt" 2>/dev/null || true
          grep '^warning' "$build_log" > "${RUNNER_TEMP:-/tmp}/w.txt" 2>/dev/null || true
          compiling=$(n "${RUNNER_TEMP:-/tmp}/c.txt"); compiling=${compiling:-0}
          building=$(n "${RUNNER_TEMP:-/tmp}/b.txt"); building=${building:-0}
          downloading=$(n "${RUNNER_TEMP:-/tmp}/d.txt"); downloading=${downloading:-0}
          warnings=$(n "${RUNNER_TEMP:-/tmp}/w.txt"); warnings=${warnings:-0}

          echo
          echo "===== 编译统计 ====="
          echo "耗时(秒)          : ${elapsed}"
          echo "耗时(分秒)        : $((elapsed / 60))m$((elapsed % 60))s"
          echo "Compiling 行数    : ${compiling}"
          echo "Building 行数     : ${building}"
          echo "Downloading 行数  : ${downloading}"
          echo "warning 数        : ${warnings}"
          echo "--- Finished 行 ---"
          grep -E 'Finished|Compiling codex-cli' "$build_log" 2>/dev/null | tail -3 || true
          echo "--- 最后 10 个 Compiling（关键路径末尾）---"
          grep 'Compiling ' "$build_log" 2>/dev/null | tail -10 || true
          echo "::notice::编译耗时 ${elapsed} 秒, Compiling 行数 ${compiling}"

      # ── 诊断：编译后 ───────────────────────────────────────────────
      - name: 诊断（编译后）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          line() { printf '\n===== %s =====\n' "$1"; }
          target="upstream/codex-rs/target"

          line "1. target 总大小（判断能否进 GitHub 缓存）"
          if [[ -d "$target" ]]; then
            du -sh "$target" 2>/dev/null || true
            echo "--- 一级子目录 ---"
            du -sh "$target"/* 2>/dev/null | sort -rh | head -10 || true
            echo "--- 目录数 / 文件数 ---"
            find "$target" -type d 2>/dev/null | wc -l
            find "$target" -type f 2>/dev/null | wc -l
            echo "--- 总字节数（精确）---"
            find "$target" -type f -printf '%s\n' 2>/dev/null | awk '{s+=$1} END {printf "%.2f GB\n", s/1024/1024/1024}'
          else
            echo "(target 不存在)"
          fi

          line "2. release 产物"
          REL="$target/x86_64-pc-windows-msvc/release"
          if [[ -d "$REL" ]]; then
            du -sh "$REL" 2>/dev/null || true
            echo "顶层文件数 : $(find "$REL" -maxdepth 1 -type f 2>/dev/null | wc -l)"
            echo "rlib       : $(find "$REL" -maxdepth 1 -name '*.rlib' 2>/dev/null | wc -l)"
            echo "rmeta      : $(find "$REL" -maxdepth 1 -name '*.rmeta' 2>/dev/null | wc -l)"
            echo "exe        : $(find "$REL" -maxdepth 1 -name '*.exe' 2>/dev/null | wc -l)"
            echo "pdb        : $(find "$REL" -maxdepth 1 -name '*.pdb' 2>/dev/null | wc -l)"
            echo "--- 前 5 大的文件 ---"
            find "$REL" -maxdepth 1 -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -5 | \
              awk '{printf "%.1f MB  %s\n", $1/1024/1024, $2}'
            echo "--- deps 目录 ---"
            if [[ -d "$REL/deps" ]]; then
              du -sh "$REL/deps" 2>/dev/null || true
              echo "deps 文件数: $(find "$REL/deps" -type f 2>/dev/null | wc -l)"
              echo "deps .rlib : $(find "$REL/deps" -maxdepth 1 -name '*.rlib' 2>/dev/null | wc -l)"
            fi
            echo "--- build 目录（build script 产物）---"
            [[ -d "$REL/build" ]] && du -sh "$REL/build" 2>/dev/null || echo "(无 build 目录)"
            echo "--- fingerprint 目录（决定 cargo 是否复用）---"
            [[ -d "$target/release/.fingerprint" ]] && \
              echo "fingerprint 子目录数: $(find "$target/release/.fingerprint" -maxdepth 1 -type d 2>/dev/null | wc -l)" || \
              echo "(无 fingerprint 目录)"
          else
            echo "(release 目录不存在)"
          fi

          line "3. 最终产物"
          exe="$REL/${BINARY}.exe"
          if [[ -f "$exe" ]]; then
            ls -la "$exe"
            echo "大小(MB): $(du -m "$exe" 2>/dev/null | cut -f1)"
            echo "sha256   : $(sha256sum "$exe" 2>/dev/null | cut -d' ' -f1)"
          else
            echo "(未找到 ${BINARY}.exe)"
          fi

          line "4. 磁盘剩余（与编译前对比）"
          df -h . 2>/dev/null || true

          echo
          echo "===== 诊断（编译后）结束 ====="

      - name: 校验产物
        shell: bash
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          exe="target/x86_64-pc-windows-msvc/release/${BINARY}.exe"
          if [[ ! -f "${exe}" ]]; then
            echo "::error::未找到 ${exe}"
            exit 1
          fi
          ls -la "${exe}"
          "${exe}" --version

      - name: 打包
        shell: bash
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          exe="target/x86_64-pc-windows-msvc/release/${BINARY}.exe"
          mkdir -p dist
          cp "${exe}" "dist/codex.exe"
          # 一起带上版本信息，方便替换前核对
          {
            echo "upstream_tag: ${tag}"
            echo "patch_file: ${{ needs.resolve.outputs.patch }}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          # 附带本次实际使用的补丁，便于核对/复现
          cp "${GITHUB_WORKSPACE}/${{ needs.resolve.outputs.patch }}" dist/codex-cli.patch
          cd dist && 7z a -tzip "../codex-${tag}-windows-x64.zip" ./

      - uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x64
          path: upstream/codex-rs/codex-*.zip

  # ── 阶段 4：发 Release 并记录已构建 tag ───────────────────────────
  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: codex-windows-x64
          path: dist

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          cat > notes.md <<'EOF'
          基于官方 tag，应用了该 tag 专属补丁后编译的 Windows x64 版 codex.exe。补丁文件见 Release 附件 `codex-cli.patch`。

          ### 替换方法

          解压后把 `codex.exe` 覆盖到 npm 包的 vendor 目录：

          ```
          node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe
          ```

          替换前建议备份原文件。用 `codex --version` 验证。

          ### 补丁内容

          - 模型请求进度用数据包体积代替 token 估算
          - 压缩横幅区分本地压缩 / 远程压缩
          - 重试上限 1000 次、固定 10 秒间隔
          - ServerOverloaded 等允许重试
          - cyber 警告降为 Warning
          - resume 忽略 provider 过滤
          - GPT-5.6 上下文 353k
          - 无输出时 Esc 快速改提示词
          - 日志等级 INFO
          EOF

          # 把基线版本补进说明
          sed -i "1s/^基于官方 tag/基于官方 ${TAG}/" notes.md

          # 幂等：Release 已存在时不能再用 create（重名直接失败），
          # 而且 gh release create 并不支持 --clobber（只有 upload 支持）。
          # 所以先探测，已存在则改说明 + 覆盖附件。
          title="${TAG} + codex-cli patches"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新说明并覆盖附件"
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes-file notes.md
            gh release upload "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              dist/*
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes-file notes.md \
              dist/*
          fi

      - name: 记录已构建 tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qxF "${TAG}" built-tags.txt; then
            echo "${TAG}" >> built-tags.txt
            git config user.email "ci@localhost"
            git config user.name "ci"
            git add built-tags.txt
            git commit -m "Record built tag ${TAG}"
            git push
          fi
